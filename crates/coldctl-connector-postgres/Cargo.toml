[package]
name = "coldctl-connector-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
coldctl-core.workspace = true
coldctl-connector-protocol.workspace = true
coldctl-connector-runtime = { path = "../coldctl-connector-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
sha2 = "0.11"
