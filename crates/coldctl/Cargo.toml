[package]
name = "coldctl"
description = "CLI for analyzing, archiving, verifying, and restoring PostgreSQL data"
readme = "../../README.md"
keywords = ["database", "archive", "postgresql", "parquet", "cli"]
categories = ["command-line-utilities", "database"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
clap.workspace = true
coldctl-core.workspace = true
coldctl-cloud.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
