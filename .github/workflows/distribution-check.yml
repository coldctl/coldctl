name: distribution check (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distribution-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  packages:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.88.0 --profile minimal --target ${{ matrix.target }}
      - run: python scripts/package.py --check-inputs
      - name: Build base agent and separate connector packages
        shell: bash
        run: |
          for component in coldctl coldctl-connector-postgres coldctl-connector-mysql coldctl-connector-mongodb; do
            python scripts/package.py --target '${{ matrix.target }}' --component "$component" --require-clean
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-${{ github.sha }}-${{ matrix.target }}
          path: target/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Record qualification scope
        shell: bash
        run: |
          echo 'Base agent and optional connectors packaged. These workflow artifacts are unsigned qualification builds, not published releases or a signed connector registry.' >> "$GITHUB_STEP_SUMMARY"
