name: release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coldctl-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate version tag and signing bootstrap
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          test -f release/root.json
          python scripts/release.py validate --tag "$RELEASE_TAG"
      - run: python scripts/test_release.py
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal --target ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/package.py --target ${{ matrix.target }} --require-clean
      - run: python scripts/package.py --target ${{ matrix.target }} --component coldctl-connector-postgres --require-clean
      - run: python scripts/package.py --target ${{ matrix.target }} --component coldctl-connector-mysql --require-clean
      - run: python scripts/package.py --target ${{ matrix.target }} --component coldctl-connector-mongodb --require-clean
      - shell: bash
        run: |
          for engine in postgres mysql mongodb; do
            binary="target/${{ matrix.target }}/release/coldctl-connector-$engine"
            if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
            python scripts/connector_targets.py --binary "$binary" --target "${{ matrix.target }}" --out "target/unsigned-connector-targets/$engine"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-connector-targets-${{ matrix.target }}
          path: target/unsigned-connector-targets/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            target/packages/*.zip
            target/packages/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coldctl-${{ matrix.target }}
          path: target/packages/*
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [validate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: target/release-input
      - run: rustup toolchain install 1.88.0 --profile minimal
      - name: Retrieve the previous stable registry
        run: python scripts/release.py previous --tag "$RELEASE_TAG" --out target/previous-release
      - name: Verify history, sign the registry and assemble downloads
        env:
          COLDCTL_TUF_ONLINE_KEY: ${{ secrets.COLDCTL_TUF_ONLINE_KEY }}
        shell: bash
        run: |
          previous=()
          if [[ -f target/previous-release/connector-registry.zip ]]; then
            previous=(--previous target/previous-release/connector-registry.zip)
          fi
          python scripts/release.py prepare --tag "$RELEASE_TAG" --artifacts target/release-input --out target/release-assets "${previous[@]}"
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: target/release-assets/SHA256SUMS
      - name: Publish only after every asset is uploaded
        run: python scripts/release.py publish --tag "$RELEASE_TAG" --out target/release-assets --notes target/release-notes.md
