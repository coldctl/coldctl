name: release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal --target ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/package.py --target ${{ matrix.target }} --require-clean
      - run: python scripts/package.py --target ${{ matrix.target }} --component coldctl-connector-postgres --require-clean
      - run: python scripts/package.py --target ${{ matrix.target }} --component coldctl-connector-mysql --require-clean
      - run: python scripts/package.py --target ${{ matrix.target }} --component coldctl-connector-mongodb --require-clean
      - shell: bash
        run: |
          for engine in postgres mysql mongodb; do
            binary="target/${{ matrix.target }}/release/coldctl-connector-$engine"
            if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
            python scripts/connector_targets.py --binary "$binary" --target "${{ matrix.target }}" --out "target/unsigned-connector-targets/$engine"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-connector-targets-${{ matrix.target }}
          path: target/unsigned-connector-targets/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            target/packages/*.zip
            target/packages/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coldctl-${{ matrix.target }}
          path: target/packages/*
          if-no-files-found: error
          retention-days: 30
