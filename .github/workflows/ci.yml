name: checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  local:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      COLDCTL_ALLOW_UNVERIFIED_CONNECTOR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: cargo build --locked -p coldctl-connector-postgres -p coldctl-connector-mysql -p coldctl-connector-mongodb
      - shell: bash
        run: |
          connector="$GITHUB_WORKSPACE/target/debug/coldctl-connector-postgres"
          if [[ "$RUNNER_OS" == "Windows" ]]; then connector="$connector.exe"; fi
          echo "COLDCTL_POSTGRES_CONNECTOR=$connector" >> "$GITHUB_ENV"
          echo "COLDCTL_SIGNED_TEST_BINARY=$connector" >> "$GITHUB_ENV"
          echo "COLDCTL_SIGNED_TEST_MYSQL_BINARY=${connector/postgres/mysql}" >> "$GITHUB_ENV"
          echo "COLDCTL_SIGNED_TEST_MONGODB_BINARY=${connector/postgres/mongodb}" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked
      - run: cargo test -p coldctl-core native_connector_runs_with_a_package_lease --locked -- --ignored
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python scripts/check_connector_dependencies.py
      - run: python scripts/package.py --check-inputs
      - run: python scripts/test_package.py
      - run: python scripts/test_azurite_init.py
      - run: python scripts/test_release.py
      - run: cargo build --locked -p coldctl
      - run: python scripts/test-background-sync.py
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: coldctl_test_source
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      COLDCTL_ALLOW_UNVERIFIED_CONNECTOR: "1"
      COLDCTL_TEST_POSTGRES_URL: postgres://postgres:disposable_ci_password@localhost:5432/coldctl_test_source?sslmode=disable
      COLDCTL_TEST_RESTORE_URL: postgres://postgres:disposable_ci_password@localhost:5432/coldctl_test_restore?sslmode=disable
      COLDCTL_TEST_ROLE_PASSWORD: coldctl_test_role_password
      PGPASSWORD: disposable_ci_password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE coldctl_test_restore'
      - run: cargo build --locked -p coldctl-connector-postgres -p coldctl-connector-mysql -p coldctl-connector-mongodb
      - run: echo "COLDCTL_POSTGRES_CONNECTOR=$GITHUB_WORKSPACE/target/debug/coldctl-connector-postgres" >> "$GITHUB_ENV"
      - run: echo "COLDCTL_SIGNED_TEST_BINARY=$GITHUB_WORKSPACE/target/debug/coldctl-connector-postgres" >> "$GITHUB_ENV"
      - run: echo "COLDCTL_SIGNED_TEST_MYSQL_BINARY=$GITHUB_WORKSPACE/target/debug/coldctl-connector-mysql" >> "$GITHUB_ENV"
      - run: echo "COLDCTL_SIGNED_TEST_MONGODB_BINARY=$GITHUB_WORKSPACE/target/debug/coldctl-connector-mongodb" >> "$GITHUB_ENV"
      # Object-storage integration tests run in the s3 and azure jobs with their own fixtures.
      - run: cargo test --workspace --exclude coldctl-connector-mysql --exclude coldctl-connector-mongodb --locked -- --ignored --skip s3_ --skip azure_
  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: coldctl_disposable_mysql_phase4
          MYSQL_DATABASE: coldctl_test_source
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      COLDCTL_ALLOW_UNVERIFIED_CONNECTOR: "1"
      COLDCTL_TEST_MYSQL_URL: mysql://root:coldctl_disposable_mysql_phase4@localhost:3306/coldctl_test_source?sslmode=require
      COLDCTL_TEST_MYSQL_RESTORE_URL: mysql://root:coldctl_disposable_mysql_phase4@localhost:3306/coldctl_test_restore?sslmode=require
      COLDCTL_TEST_MYSQL_ROLE_PASSWORD: coldctl_mysql_role_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: docker exec -i ${{ job.services.mysql.id }} sh < scripts/mysql_test_tls.sh
      - shell: bash
        run: |
          echo "COLDCTL_MYSQL_CONNECTOR=$GITHUB_WORKSPACE/target/debug/coldctl-connector-mysql" >> "$GITHUB_ENV"
          echo 'COLDCTL_TEST_MYSQL_CA<<COLDCTL_CA_END' >> "$GITHUB_ENV"
          docker exec ${{ job.services.mysql.id }} cat /var/lib/mysql/phase4-ca.pem >> "$GITHUB_ENV"
          echo 'COLDCTL_CA_END' >> "$GITHUB_ENV"
      - run: cargo build --locked -p coldctl-connector-mysql
      - run: cargo test -p coldctl-connector-mysql --locked -- --ignored
  mongodb:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      COLDCTL_ALLOW_UNVERIFIED_CONNECTOR: "1"
      COLDCTL_TEST_MONGODB_PASSWORD: coldctl_mongodb_fixture_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - shell: bash
        run: |
          docker run -d --name coldctl-mongo-ci -p 127.0.0.1:15443:27017 -v "$GITHUB_WORKSPACE/scripts:/fixture:ro" --entrypoint sh mongo:8.0 /fixture/mongodb_test_start.sh
          for attempt in {1..60}; do
            if docker exec coldctl-mongo-ci mongosh --quiet --eval 'db.runCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec coldctl-mongo-ci mongosh --quiet /fixture/mongodb_test_bootstrap.js
          echo "COLDCTL_MONGODB_CONNECTOR=$GITHUB_WORKSPACE/target/debug/coldctl-connector-mongodb" >> "$GITHUB_ENV"
          echo 'COLDCTL_TEST_MONGODB_CA<<COLDCTL_CA_END' >> "$GITHUB_ENV"
          docker exec coldctl-mongo-ci cat /tmp/ca.crt >> "$GITHUB_ENV"
          echo 'COLDCTL_CA_END' >> "$GITHUB_ENV"
      - run: cargo build --locked -p coldctl-connector-mongodb
      - run: cargo test -p coldctl-connector-mongodb --locked -- --ignored
      - if: always()
        run: docker rm -f -v coldctl-mongo-ci
  s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      AWS_ACCESS_KEY_ID: coldctl_fixture
      AWS_SECRET_ACCESS_KEY: coldctl_fixture_only
      COLDCTL_TEST_S3_ENDPOINT: http://127.0.0.1:19000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - shell: bash
        run: |
          docker compose -f scripts/compose.s3.yml up -d
          for attempt in {1..30}; do
            if docker compose -f scripts/compose.s3.yml exec -T s3 python -c "import boto3; boto3.client('s3',endpoint_url='http://localhost:5000',region_name='us-east-1',aws_access_key_id='coldctl_fixture',aws_secret_access_key='coldctl_fixture_only').create_bucket(Bucket='coldctl-test')"; then break; fi
            sleep 1
          done
      - run: cargo test --locked -p coldctl-core --lib s3_ -- --ignored
      - if: always()
        run: docker compose -f scripts/compose.s3.yml down
  azure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      AZURE_STORAGE_ACCOUNT_KEY: Y29sZGN0bC1henVyaXRlLWZpeHR1cmUta2V5LW9ubHk=
      COLDCTL_TEST_AZURE_ENDPOINT: http://127.0.0.1:11000/coldctltest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: docker compose -f scripts/compose.azure.yml up -d
      - run: python3 scripts/init-azurite.py
      - run: cargo test --locked -p coldctl-core --lib azure_ -- --ignored
      - if: always()
        run: docker compose -f scripts/compose.azure.yml down
  recurring-s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - shell: bash
        run: |
          docker run -d --name coldctl-recurring-pg -p 127.0.0.1:15446:5432 -e POSTGRES_PASSWORD=coldctl_recurring_fixture -e POSTGRES_DB=coldctl_test_source postgres:15
          docker run -d --name coldctl-recurring-mongo -p 127.0.0.1:15443:27017 -v "$GITHUB_WORKSPACE/scripts:/fixture:ro" --entrypoint sh mongo:8.0 /fixture/mongodb_test_start.sh
          docker compose -f scripts/compose.s3.yml up -d
          for attempt in {1..60}; do
            if docker exec coldctl-recurring-mongo mongosh --quiet --eval 'db.runCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec coldctl-recurring-mongo mongosh --quiet /fixture/mongodb_test_bootstrap.js
          for attempt in {1..30}; do
            if docker compose -f scripts/compose.s3.yml exec -T s3 python -c "import boto3; boto3.client('s3',endpoint_url='http://localhost:5000',region_name='us-east-1',aws_access_key_id='coldctl_fixture',aws_secret_access_key='coldctl_fixture_only').create_bucket(Bucket='coldctl-test')"; then break; fi
            sleep 1
          done
      - run: cargo build --locked -p coldctl -p coldctl-connector-postgres -p coldctl-connector-mongodb
      - run: python3 scripts/test_recurring_s3.py
      - if: always()
        run: |
          docker rm -f -v coldctl-recurring-pg coldctl-recurring-mongo
          docker compose -f scripts/compose.s3.yml down
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      COLDCTL_ALLOW_UNVERIFIED_CONNECTOR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: python scripts/test_audit.py
      - run: python scripts/audit.py
      - name: Preserve dependency audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/audit.json
          if-no-files-found: warn
          retention-days: 7
